
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navidad en Familia 2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background: #f8f3e9;
      color: #294536;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top, #42694f, #173d2b 75%);
      color: #fff8e9;
      position: relative;
      overflow: hidden;
    }

    .lights {
      color: #f6d98b;
      font-size: 22px;
      letter-spacing: 12px;
      margin-bottom: 35px;
    }

    .year {
      color: #f2d28a;
      letter-spacing: 6px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 68px);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    h1 span {
      color: #edcc82;
    }

    .tree {
      font-size: 105px;
      margin: 20px 0;
      filter: drop-shadow(0 8px 15px #102719);
    }

    .message {
      max-width: 520px;
      font-size: 17px;
      line-height: 1.8;
      color: #f5ead5;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 15px 32px;
      border-radius: 30px;
      background: #b52e36;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 15px;
      transition: 0.3s;
    }

    .button:hover {
      background: #d4474e;
      transform: translateY(-3px);
    }

    footer {
      margin-top: 55px;
      color: #e7cf9e;
      font-size: 13px;
      letter-spacing: 1px;
    }

  </style>
</head>

<body>

  <main class="hero">

    <div class="lights">✦ ✧ ✦ ✧ ✦ ✧ ✦</div>

    <p class="year">NAVIDAD 2026</p>

    <h1>
      Navidad en<br>
      <span>Familia</span>
    </h1>

    <div class="tree">🎄</div>

    <p class="message">
      La Navidad es más bonita cuando la compartimos.
      Este año queremos crear recuerdos, compartir deseos
      y celebrar juntos la magia de estar en familia.
    </p>

    <a href="#bienvenida" class="button">
      Nuestra Navidad comienza aquí
    </a>

    <footer>
      CON AMOR, PARA NUESTRA FAMILIA · 2026
    </footer>

  </main>

</body>
</html>
